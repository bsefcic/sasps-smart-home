name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, tests and format check
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Run both starter demos
        run: |
          java -jar app/target/smart-home.jar baseline > baseline.json
          java -jar app/target/smart-home.jar patterns > patterns.json
          diff baseline.json patterns.json
      - name: Reject invalid variant
        run: |
          if java -jar app/target/smart-home.jar invalid; then
            echo "Invalid variant must fail"
            exit 1
          fi
      - name: Start packaged Spring server and check health
        run: |
          java -jar server/target/smart-home-server.jar --server.port=18080 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/api/v1/health > health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"UP"' health.json
          curl --fail --silent --max-time 5 http://127.0.0.1:18080/api/v1/home

      - name: Archive test reports and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-21-${{ github.run_attempt }}
          path: |
            **/target/surefire-reports/
            server.log
            health.json
            baseline.json
            patterns.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare server delivery
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p delivery
          cp server/target/smart-home-server.jar delivery/
          printf '%s\n' "$BUILD_COMMIT" > delivery/COMMIT.txt
          cd delivery
          sha256sum smart-home-server.jar > SHA256SUMS
      - name: Archive runnable server
        uses: actions/upload-artifact@v4
        with:
          name: smart-home-server-${{ github.sha }}-${{ github.run_attempt }}
          path: delivery/
          if-no-files-found: error
          retention-days: 14

openapi: 3.0.3
info:
  title: SASPS Smart Home API — Sprint 2
  version: 1.2.0
  description: >-
    Target contract for both variants. Nested scene execution (S2-03) is
    implemented and described in the packaged /openapi.yaml. Temperature
    readings and mode selection are specified for S2-05.
servers:
  - url: http://127.0.0.1:8080
    description: patterns
  - url: http://127.0.0.1:8081
    description: baseline
paths:
  /api/v1/health:
    $ref: '../server/src/main/resources/static/openapi.yaml#/paths/~1api~1v1~1health'
  /api/v1/home:
    $ref: '../server/src/main/resources/static/openapi.yaml#/paths/~1api~1v1~1home'
  /api/v1/commands:
    $ref: '../server/src/main/resources/static/openapi.yaml#/paths/~1api~1v1~1commands'
  /api/v1/sensors/motion:
    $ref: '../server/src/main/resources/static/openapi.yaml#/paths/~1api~1v1~1sensors~1motion'
  /api/v1/scenes/execute:
    $ref: '../server/src/main/resources/static/openapi.yaml#/paths/~1api~1v1~1scenes~1execute'
  /api/v1/automation/temperature-mode:
    post:
      operationId: setTemperatureMode
      description: >-
        Planned for S2-05. Select the session mode for subsequent readings.
        Each home starts in comfort. Selecting a mode does not change the
        thermostat target.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemperatureModeRequest'}
            example: {mode: eco}
      responses:
        '200':
          description: Active mode after selection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemperatureModeResponse'}
              example: {ok: true, mode: eco}
        '400': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '415': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '500': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
  /api/v1/sensors/temperature:
    post:
      operationId: reportTemperature
      description: >-
        Planned for S2-05. Every accepted living-temperature reading applies the
        active policy to living-thermostat. Comfort sets 22°C below 21°C. Eco
        sets 18°C below 17°C. At or above the mode threshold, the target is
        retained. Each reading and its effects are handled under the session lock.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemperatureReading'}
            example: {sensorId: living-temperature, temperature: 16.0}
      responses:
        '200':
          description: Temperature reading accepted and policy applied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemperatureReadingResponse'}
              example:
                ok: true
                executedCommands: 1
                snapshot:
                  devices:
                    - {id: bedroom-thermostat, kind: thermostat, targetTemperature: 20.0}
                    - {id: living-light, kind: light, power: false}
                    - {id: living-thermostat, kind: thermostat, targetTemperature: 18.0}
        '400': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '404': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '415': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '422': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '500': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
components:
  schemas:
    TemperatureMode:
      type: string
      enum: [comfort, eco]
    TemperatureModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {$ref: '#/components/schemas/TemperatureMode'}
    TemperatureModeResponse:
      type: object
      additionalProperties: false
      required: [ok, mode]
      properties:
        ok: {type: boolean, enum: [true]}
        mode: {$ref: '#/components/schemas/TemperatureMode'}
    TemperatureReading:
      type: object
      additionalProperties: false
      required: [sensorId, temperature]
      properties:
        sensorId: {$ref: '../server/src/main/resources/static/openapi.yaml#/components/schemas/DeviceId'}
        temperature: {$ref: '../server/src/main/resources/static/openapi.yaml#/components/schemas/Temperature'}
    TemperatureReadingResponse:
      type: object
      additionalProperties: false
      required: [ok, executedCommands, snapshot]
      properties:
        ok: {type: boolean, enum: [true]}
        executedCommands:
          type: integer
          enum: [0, 1]
          description: One if the policy issued the temperature command, zero if it retained the target.
        snapshot: {$ref: '../server/src/main/resources/static/openapi.yaml#/components/schemas/HomeSnapshot'}

openapi: 3.0.3
info:
  title: SASPS Smart Home API — Sprint 2
  version: 1.2.0
  description: >-
    Target contract for both variants. The nested form of scene execution is
    specified for S2-03. Temperature readings and mode selection are specified
    for S2-05. The packaged /openapi.yaml describes the available API.
servers:
  - url: http://127.0.0.1:8080
    description: patterns
  - url: http://127.0.0.1:8081
    description: baseline
paths:
  /api/v1/health:
    $ref: '../server/src/main/resources/static/openapi.yaml#/paths/~1api~1v1~1health'
  /api/v1/home:
    $ref: '../server/src/main/resources/static/openapi.yaml#/paths/~1api~1v1~1home'
  /api/v1/commands:
    $ref: '../server/src/main/resources/static/openapi.yaml#/paths/~1api~1v1~1commands'
  /api/v1/sensors/motion:
    $ref: '../server/src/main/resources/static/openapi.yaml#/paths/~1api~1v1~1sensors~1motion'
  /api/v1/scenes/execute:
    post:
      operationId: executeScene
      description: >-
        The flat request is already available. S2-03 adds the nested form.
        Resolve local scene references depth-first and left to right, starting at
        depth 1. Depth is at most 5 and expansion is at most 50 leaf commands.
        Reuse is allowed. Active-path cycles, unresolved references and unused
        definitions are rejected. Validate the entire request before applying any
        command. The response counts executed leaf commands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '../server/src/main/resources/static/openapi.yaml#/components/schemas/SceneRequest'}
                - {$ref: '#/components/schemas/NestedSceneRequest'}
            examples:
              repeatedSubscene:
                value:
                  name: evening
                  commands:
                    - {type: scene-ref, sceneId: warm}
                    - {type: set-target-temperature, deviceId: bedroom-thermostat, temperature: 18}
                    - {type: scene-ref, sceneId: warm}
                  scenes:
                    warm:
                      commands:
                        - {type: scene-ref, sceneId: bedroom}
                    bedroom:
                      commands:
                        - {type: set-target-temperature, deviceId: bedroom-thermostat, temperature: 22.1}
      responses:
        '200': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Execution'}
        '400':
          description: Invalid scene, command, local reference, cycle, or expansion limit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SceneError'}
              example:
                ok: false
                error:
                  code: SCENE_CYCLE
                  message: 'Scene cycle: loop'
                  commandPath: [1, 0]
        '404': {$ref: '#/components/responses/SceneError'}
        '422': {$ref: '#/components/responses/SceneError'}
        '415': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '500': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
  /api/v1/automation/temperature-mode:
    post:
      operationId: setTemperatureMode
      description: >-
        Planned for S2-05. Select the session mode for subsequent readings.
        Each home starts in comfort. Selecting a mode does not change the
        thermostat target.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemperatureModeRequest'}
            example: {mode: eco}
      responses:
        '200':
          description: Active mode after selection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemperatureModeResponse'}
              example: {ok: true, mode: eco}
        '400': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '415': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '500': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
  /api/v1/sensors/temperature:
    post:
      operationId: reportTemperature
      description: >-
        Planned for S2-05. Every accepted living-temperature reading applies the
        active policy to living-thermostat. Comfort sets 22°C below 21°C. Eco
        sets 18°C below 17°C. At or above the mode threshold, the target is
        retained. Each reading and its effects are handled under the session lock.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemperatureReading'}
            example: {sensorId: living-temperature, temperature: 16.0}
      responses:
        '200':
          description: Temperature reading accepted and policy applied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemperatureReadingResponse'}
              example:
                ok: true
                executedCommands: 1
                snapshot:
                  devices:
                    - {id: bedroom-thermostat, kind: thermostat, targetTemperature: 20.0}
                    - {id: living-light, kind: light, power: false}
                    - {id: living-thermostat, kind: thermostat, targetTemperature: 18.0}
        '400': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '404': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '415': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '422': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
        '500': {$ref: '../server/src/main/resources/static/openapi.yaml#/components/responses/Error'}
components:
  responses:
    SceneError:
      description: Validation failed and the scene had no effects.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SceneError'}
  schemas:
    NestedSceneRequest:
      type: object
      additionalProperties: false
      required: [name, commands, scenes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '\S'
          description: Nonblank, at most 64 UTF-16 code units, kept unchanged.
        commands: {$ref: '#/components/schemas/SceneEntries'}
        scenes:
          type: object
          maxProperties: 50
          description: Local definitions. IDs match ^[a-z][a-z0-9-]{0,63}$.
          additionalProperties:
            type: object
            additionalProperties: false
            required: [commands]
            properties:
              commands: {$ref: '#/components/schemas/SceneEntries'}
    SceneEntries:
      type: array
      minItems: 1
      maxItems: 50
      items:
        oneOf:
          - {$ref: '../server/src/main/resources/static/openapi.yaml#/components/schemas/Command'}
          - {$ref: '#/components/schemas/SceneReference'}
    SceneReference:
      type: object
      additionalProperties: false
      required: [type, sceneId]
      properties:
        type: {type: string, enum: [scene-ref]}
        sceneId: {$ref: '../server/src/main/resources/static/openapi.yaml#/components/schemas/DeviceId'}
    SceneError:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok: {type: boolean, enum: [false]}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          not:
            required: [commandIndex, commandPath]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_SCENE, INVALID_COMMAND, UNKNOWN_SCENE, SCENE_CYCLE, SCENE_LIMIT_EXCEEDED, UNKNOWN_DEVICE, INVALID_TEMPERATURE, INCOMPATIBLE_DEVICE]
            message: {type: string}
            commandIndex:
              type: integer
              minimum: 0
              maximum: 49
              description: Zero-based index for an item error in a flat scene.
            commandPath:
              type: array
              minItems: 1
              maxItems: 5
              description: Zero-based indices from the root commands list to the rejected item.
              items: {type: integer, minimum: 0, maximum: 49}
    TemperatureMode:
      type: string
      enum: [comfort, eco]
    TemperatureModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {$ref: '#/components/schemas/TemperatureMode'}
    TemperatureModeResponse:
      type: object
      additionalProperties: false
      required: [ok, mode]
      properties:
        ok: {type: boolean, enum: [true]}
        mode: {$ref: '#/components/schemas/TemperatureMode'}
    TemperatureReading:
      type: object
      additionalProperties: false
      required: [sensorId, temperature]
      properties:
        sensorId: {$ref: '../server/src/main/resources/static/openapi.yaml#/components/schemas/DeviceId'}
        temperature: {$ref: '../server/src/main/resources/static/openapi.yaml#/components/schemas/Temperature'}
    TemperatureReadingResponse:
      type: object
      additionalProperties: false
      required: [ok, executedCommands, snapshot]
      properties:
        ok: {type: boolean, enum: [true]}
        executedCommands:
          type: integer
          enum: [0, 1]
          description: One if the policy issued the temperature command, zero if it retained the target.
        snapshot: {$ref: '../server/src/main/resources/static/openapi.yaml#/components/schemas/HomeSnapshot'}

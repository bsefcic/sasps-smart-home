spring.application.name=sasps-smart-home
server.address=127.0.0.1
server.port=8080
smart-home.variant=patterns
smart-home.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

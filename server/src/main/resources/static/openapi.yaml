openapi: 3.0.3
info:
  title: SASPS Smart Home API
  version: 1.1.0
  description: >-
    Contract v1. Implements light control, Vendor A and B thermostat control,
    motion readings, home snapshots, and flat and nested scenes.
    Baseline and patterns expose the same HTTP contract. Scene commands are
    validated before execution. A rejected command inside a flat scene reports a
    zero-based commandIndex, an element of a nested scene reports a commandPath,
    and rejected requests leave device state unchanged.
servers:
  - url: http://127.0.0.1:8080
    description: patterns (default)
  - url: http://127.0.0.1:8081
    description: baseline process
paths:
  /api/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Server running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: {type: string, enum: [UP]}
  /api/v1/home:
    get:
      operationId: getHome
      responses:
        '200':
          description: Current immutable state, devices ordered by id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HomeSnapshot'}
              example:
                devices:
                  - {id: bedroom-thermostat, kind: thermostat, targetTemperature: 20.0}
                  - {id: living-light, kind: light, power: false}
                  - {id: living-thermostat, kind: thermostat, targetTemperature: 20.0}
  /api/v1/commands:
    post:
      operationId: executeCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Command'}
            examples:
              light:
                value: {type: set-light-power, deviceId: living-light, power: true}
              vendorA:
                value: {type: set-target-temperature, deviceId: living-thermostat, temperature: 22.1}
              vendorB:
                value: {type: set-target-temperature, deviceId: bedroom-thermostat, temperature: 22.1}
      responses:
        '200': {$ref: '#/components/responses/Execution'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sensors/motion:
    post:
      operationId: reportMotion
      description: >-
        The living-motion sensor starts at false. A false-to-true transition turns
        on living-light. A false reading or a repeated true leaves the light
        unchanged. A false reading allows the next true to trigger the rule again.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MotionReading'}
            example: {sensorId: living-motion, motion: true}
      responses:
        '200':
          description: Reading accepted. executedCommands is 1 even when no light command runs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/scenes/execute:
    post:
      operationId: executeScene
      description: >-
        The presence of scenes selects the nested form. Local references are
        resolved depth-first and left to right, starting at depth 1. Depth is at
        most 5 and expansion is at most 50 leaf commands. Reuse is allowed.
        Active-path cycles, unresolved references and unused definitions are
        rejected. The entire request is validated before any command is applied.
        The response counts executed leaf commands. See docs/contracts-sprint-2.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/SceneRequest'}
                - {$ref: '#/components/schemas/NestedSceneRequest'}
            examples:
              repeatedSubscene:
                value:
                  name: evening
                  commands:
                    - {type: scene-ref, sceneId: warm}
                    - {type: set-target-temperature, deviceId: bedroom-thermostat, temperature: 18}
                    - {type: scene-ref, sceneId: warm}
                  scenes:
                    warm:
                      commands:
                        - {type: scene-ref, sceneId: bedroom}
                    bedroom:
                      commands:
                        - {type: set-target-temperature, deviceId: bedroom-thermostat, temperature: 22.1}
      responses:
        '200': {$ref: '#/components/responses/Execution'}
        '400':
          description: Invalid scene, command, local reference, cycle, or expansion limit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                ok: false
                error:
                  code: SCENE_CYCLE
                  message: 'Scene cycle: loop'
                  commandPath: [1, 0]
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  responses:
    Execution:
      description: Operation completed; snapshot captured under the session lock
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ExecutionResponse'}
    Error:
      description: Rejected input has no effects; see docs/contracts-v1.md for status mapping
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    DeviceId:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
      example: living-light
    Temperature:
      type: number
      description: Degrees Celsius
      minimum: 5
      maximum: 35
      multipleOf: 0.1
      example: 22.1
    Command:
      oneOf:
        - {$ref: '#/components/schemas/SetLightPower'}
        - {$ref: '#/components/schemas/SetTargetTemperature'}
      discriminator:
        propertyName: type
        mapping:
          set-light-power: '#/components/schemas/SetLightPower'
          set-target-temperature: '#/components/schemas/SetTargetTemperature'
    SetLightPower:
      type: object
      additionalProperties: false
      required: [type, deviceId, power]
      properties:
        type: {type: string, enum: [set-light-power]}
        deviceId: {$ref: '#/components/schemas/DeviceId'}
        power: {type: boolean}
    SetTargetTemperature:
      type: object
      additionalProperties: false
      required: [type, deviceId, temperature]
      properties:
        type: {type: string, enum: [set-target-temperature]}
        deviceId: {$ref: '#/components/schemas/DeviceId'}
        temperature: {$ref: '#/components/schemas/Temperature'}
    MotionReading:
      type: object
      additionalProperties: false
      required: [sensorId, motion]
      properties:
        sensorId: {$ref: '#/components/schemas/DeviceId'}
        motion: {type: boolean}
    SceneRequest:
      type: object
      additionalProperties: false
      required: [name, commands]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '\S'
          description: Nonblank; Java String.length at most 64, kept unchanged
        commands:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/Command'}
    NestedSceneRequest:
      type: object
      additionalProperties: false
      required: [name, commands, scenes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '\S'
          description: Nonblank, at most 64 UTF-16 code units, kept unchanged.
        commands: {$ref: '#/components/schemas/SceneEntries'}
        scenes:
          type: object
          maxProperties: 50
          description: Local definitions. IDs match ^[a-z][a-z0-9-]{0,63}$.
          additionalProperties:
            type: object
            additionalProperties: false
            required: [commands]
            properties:
              commands: {$ref: '#/components/schemas/SceneEntries'}
    SceneEntries:
      type: array
      minItems: 1
      maxItems: 50
      items:
        oneOf:
          - {$ref: '#/components/schemas/Command'}
          - {$ref: '#/components/schemas/SceneReference'}
    SceneReference:
      type: object
      additionalProperties: false
      required: [type, sceneId]
      properties:
        type: {type: string, enum: [scene-ref]}
        sceneId: {$ref: '#/components/schemas/DeviceId'}
    HomeSnapshot:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          description: Sorted by id. Contains bedroom-thermostat (Vendor B), living-light, and living-thermostat (Vendor A).
          items:
            oneOf:
              - {$ref: '#/components/schemas/LightSnapshot'}
              - {$ref: '#/components/schemas/ThermostatSnapshot'}
    LightSnapshot:
      type: object
      additionalProperties: false
      required: [id, kind, power]
      properties:
        id: {$ref: '#/components/schemas/DeviceId'}
        kind: {type: string, enum: [light]}
        power: {type: boolean}
    ThermostatSnapshot:
      type: object
      additionalProperties: false
      required: [id, kind, targetTemperature]
      properties:
        id: {$ref: '#/components/schemas/DeviceId'}
        kind: {type: string, enum: [thermostat]}
        targetTemperature: {$ref: '#/components/schemas/Temperature'}
    ExecutionResponse:
      type: object
      additionalProperties: false
      required: [ok, executedCommands, snapshot]
      properties:
        ok: {type: boolean, enum: [true]}
        executedCommands: {type: integer, minimum: 1, maximum: 50}
        snapshot: {$ref: '#/components/schemas/HomeSnapshot'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok: {type: boolean, enum: [false]}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          not:
            required: [commandIndex, commandPath]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_COMMAND, INVALID_TEMPERATURE, INVALID_SCENE, UNKNOWN_SCENE, SCENE_CYCLE, SCENE_LIMIT_EXCEEDED, UNKNOWN_DEVICE, INCOMPATIBLE_DEVICE, NOT_IMPLEMENTED, NOT_FOUND, INTERNAL_ERROR]
            message: {type: string}
            commandIndex:
              type: integer
              minimum: 0
              maximum: 49
              description: Present only for an individual command error inside a flat scene
            commandPath:
              type: array
              minItems: 1
              maxItems: 5
              description: Zero-based indices from the root list to the rejected element of a nested scene
              items: {type: integer, minimum: 0, maximum: 49}
